---
# Common role tasks
- name: Install common packages
  package:
    name: "{{ common_packages }}"
    state: present
  tags: packages

- name: Configure timezone
  timezone:
    name: "{{ timezone | default('UTC') }}"
  tags: timezone

- name: Create application user
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    home: "/home/{{ app_user }}"
    create_home: yes
    system: no
  tags: users

- name: Configure firewall (UFW) for Ubuntu/Debian
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    state: enabled
  loop: "{{ firewall_rules }}"
  when: 
    - ansible_os_family == "Debian"
    - firewall_enabled | default(true)
  tags: firewall

- name: Configure firewall (firewalld) for RHEL/CentOS
  firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    permanent: yes
    state: enabled
  loop: "{{ firewall_rules }}"
  when: 
    - ansible_os_family == "RedHat"
    - firewall_enabled | default(true)
  notify: reload firewalld
  tags: firewall

- name: Configure log rotation
  template:
    src: logrotate.j2
    dest: "/etc/logrotate.d/{{ app_name }}"
    mode: '0644'
  when: log_rotation_enabled | default(true)
  tags: logging

- name: Create application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/logs"
    - "{{ app_dir }}/config"
  tags: directories
