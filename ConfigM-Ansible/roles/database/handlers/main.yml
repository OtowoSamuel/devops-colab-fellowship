---
- name: restart mysql
  systemd:
    name: "{{ database_service_name }}"
    state: restarted
    daemon_reload: yes

- name: reload mysql
  systemd:
    name: "{{ database_service_name }}"
    state: reloaded

- name: start mysql
  systemd:
    name: "{{ database_service_name }}"
    state: started
    enabled: yes
