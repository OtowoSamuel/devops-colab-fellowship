---
# Nginx role tasks
- name: Install Nginx
  package:
    name: nginx
    state: present
  tags: nginx

- name: Create Nginx user (if not exists)
  user:
    name: "{{ nginx_user }}"
    system: yes
    shell: /bin/false
    home: /var/cache/nginx
    create_home: no
  tags: nginx

- name: Create web root directory
  file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0755'
  tags: nginx

- name: Create Nginx configuration directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/conf.d
  tags: nginx

- name: Generate main Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    backup: yes
    validate: nginx -t -c %s
  notify: restart nginx
  tags: nginx

- name: Generate default site configuration
  template:
    src: default-site.conf.j2
    dest: /etc/nginx/sites-available/default
    backup: yes
  notify: restart nginx
  tags: nginx

- name: Enable default site
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: restart nginx
  tags: nginx

- name: Create custom index page
  template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0644'
  tags: nginx

- name: Configure SSL (if enabled)
  block:
    - name: Create SSL directory
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0700'

    - name: Generate self-signed SSL certificate (for testing)
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/nginx-selfsigned.key
        -out /etc/nginx/ssl/nginx-selfsigned.crt
        -subj "/C=US/ST=State/L=City/O=Organization/CN={{ ansible_default_ipv4.address }}"
      args:
        creates: /etc/nginx/ssl/nginx-selfsigned.crt
      when: ssl_cert_path is not defined

    - name: Configure SSL site
      template:
        src: ssl-site.conf.j2
        dest: /etc/nginx/sites-available/ssl
      notify: restart nginx

    - name: Enable SSL site
      file:
        src: /etc/nginx/sites-available/ssl
        dest: /etc/nginx/sites-enabled/ssl
        state: link
      notify: restart nginx
  when: ssl_enabled | default(false)
  tags: [nginx, ssl]

- name: Start and enable Nginx service
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
  tags: nginx

- name: Check Nginx configuration
  command: nginx -t
  register: nginx_config_check
  changed_when: false
  tags: nginx

- name: Display Nginx status
  debug:
    msg: "Nginx configuration is {{ 'valid' if nginx_config_check.rc == 0 else 'invalid' }}"
  tags: nginx
