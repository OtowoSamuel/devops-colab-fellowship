---
- name: Deploy Database Servers Only
  hosts: dbservers
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Update package cache
      package:
        update_cache: yes
      when: ansible_os_family == "Debian"

  roles:
    - common
    - database

  post_tasks:
    - name: Verify database service is running
      service:
        name: "{{ database_service_name | default('mysql') }}"
        state: started
        enabled: yes
